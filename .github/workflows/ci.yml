name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang \
            lld \
            llvm \
            mtools \
            qemu-system-x86 \
            ovmf \
            fdisk \
            dosfstools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Run build
        run: ./build.sh bin